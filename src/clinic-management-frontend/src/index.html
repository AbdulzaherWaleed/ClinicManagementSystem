<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ميديكا — نظام إدارة العيادات</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="نظام ميديكا لإدارة العيادات والمراكز الطبية — إدارة الحجوزات والمرضى والتقارير">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Preconnect for Google Fonts performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* Attempt to hide via CSS */
    div[style*="z-index: 2147483647"],
    div[style*="z-index: 99999"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
  <script>
    // Foolproof MutationObserver to remove the watermark
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1 && node.textContent && node.textContent.includes('Invalid PrimeUI License')) {
              node.style.setProperty('display', 'none', 'important');
              node.remove();
            }
          });
        });
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Fallback check
      setInterval(() => {
        document.querySelectorAll('div').forEach(el => {
          if (el.textContent === 'Invalid PrimeUI License') {
            el.style.setProperty('display', 'none', 'important');
          }
        });
      }, 500);
    });
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
