<div class="page-container animate-fade-in">
  
  <div class="page-header">
    <div class="header-content">
      <button pButton icon="pi pi-arrow-right" class="p-button-rounded p-button-text p-button-secondary ml-2" routerLink="/appointments/search" title="عودة"></button>
      <h1 class="page-title m-0">حجز موعد جديد</h1>
    </div>
  </div>

  <div class="card booking-card mx-auto">
    
    <!-- Server Error -->
    <div class="error-alert" *ngIf="serverError()">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ serverError() }}</span>
    </div>

    <form [formGroup]="bookingForm" (ngSubmit)="onSubmit()">
      
      <div class="form-section-title">بيانات المريض والطبيب</div>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label>المريض <span class="text-red-500">*</span></label>
          <div class="flex gap-2">
            <p-select [options]="patients()" formControlName="patientId" optionLabel="fullName" optionValue="id" placeholder="اختر المريض" styleClass="w-full flex-1" appendTo="body" [filter]="true" filterBy="fullName" [loading]="isLoadingLookups()"></p-select>
            <p-button icon="pi pi-user-plus" title="إضافة مريض جديد" severity="secondary" [outlined]="true" (onClick)="showNewPatient()"></p-button>
          </div>
          <small class="text-red-500" *ngIf="bookingForm.get('patientId')?.invalid && bookingForm.get('patientId')?.touched">يرجى اختيار المريض</small>
        </div>
        
        <div class="flex flex-col gap-2">
          <label>التخصص</label>
          <p-select [options]="specialties()" formControlName="specialty" placeholder="اختر التخصص لتصفية الأطباء" styleClass="w-full" appendTo="body" [showClear]="true"></p-select>
        </div>

        <div class="flex flex-col gap-2">
          <label>الطبيب المعالج <span class="text-red-500">*</span></label>
          <p-select [options]="filteredDoctors()" formControlName="doctorId" optionLabel="fullName" optionValue="id" placeholder="اختر الطبيب" styleClass="w-full" appendTo="body" [filter]="true" filterBy="fullName"></p-select>
          <small class="text-red-500" *ngIf="bookingForm.get('doctorId')?.invalid && bookingForm.get('doctorId')?.touched">يرجى اختيار الطبيب</small>
        </div>
      </div>

      <div class="form-section-title mt-4">تفاصيل الزيارة</div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="flex flex-col gap-2">
          <label>مرحلة الزيارة <span class="text-red-500">*</span></label>
          <p-select [options]="stages" formControlName="visitStage" placeholder="اختر المرحلة" styleClass="w-full" appendTo="body"></p-select>
          <small class="text-red-500" *ngIf="bookingForm.get('visitStage')?.invalid && bookingForm.get('visitStage')?.touched">يرجى اختيار المرحلة</small>
        </div>

        <div class="flex flex-col gap-2">
          <label>نوع الكشف <span class="text-red-500">*</span></label>
          <input pInputText formControlName="visitType" placeholder="مثال: ليزر، تنظيف أسنان..." class="w-full" />
          <small class="text-red-500" *ngIf="bookingForm.get('visitType')?.invalid && bookingForm.get('visitType')?.touched">نوع الكشف مطلوب</small>
        </div>

        <div class="flex flex-col gap-2">
          <label>وقت البدء <span class="text-red-500">*</span></label>
          <p-datepicker formControlName="scheduledStart" [showTime]="true" hourFormat="12" placeholder="اختر وقت البدء" styleClass="w-full" inputStyleClass="w-full" appendTo="body"></p-datepicker>
          <small class="text-red-500" *ngIf="bookingForm.get('scheduledStart')?.invalid && bookingForm.get('scheduledStart')?.touched">وقت البدء مطلوب</small>
        </div>

        <div class="flex flex-col gap-2 md:col-span-2">
          <label>ملاحظات (اختياري)</label>
          <textarea pTextarea formControlName="reason" rows="3" placeholder="أي ملاحظات إضافية بخصوص الحجز..." class="w-full"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 mt-6">
        <p-button type="button" label="إلغاء" severity="secondary" [outlined]="true" routerLink="/appointments/search"></p-button>
        <p-button type="submit" label="تأكيد الحجز" icon="pi pi-check" [loading]="isLoading()"></p-button>
      </div>

    </form>

  </div>

  <p-dialog
    header="إضافة مريض جديد"
    [visible]="displayPatientDialog()"
    (visibleChange)="displayPatientDialog.set($event)"
    [modal]="true"
    [style]="{ width: '420px' }"
    [draggable]="false">
    <form [formGroup]="patientForm" class="flex flex-col gap-4 mt-2" (ngSubmit)="savePatient()">
      <div class="flex flex-col gap-2">
        <label>الاسم الكامل <span class="text-red-500">*</span></label>
        <input pInputText formControlName="fullName" class="w-full" />
      </div>
      <div class="flex flex-col gap-2">
        <label>رقم الهاتف</label>
        <input pInputText formControlName="phoneNumber" class="w-full" />
      </div>
      <div class="flex flex-col gap-2">
        <label>البريد الإلكتروني</label>
        <input pInputText formControlName="email" type="email" class="w-full" />
      </div>
      <div class="flex justify-end gap-2">
        <p-button type="button" label="إلغاء" severity="secondary" [outlined]="true" (onClick)="displayPatientDialog.set(false)"></p-button>
        <p-button type="submit" label="حفظ" [loading]="isSavingPatient()"></p-button>
      </div>
    </form>
  </p-dialog>
</div>
