<div class="login-page">

  <!-- LEFT PANEL — Branding -->
  <div class="brand-panel">
    <div class="brand-content animate-fade-in">

      <div class="brand-logo">
        <i class="pi pi-heart-fill"></i>
      </div>

      <h2 class="brand-title">ميديكا</h2>
      <p class="brand-subtitle">نظام إدارة العيادات والمراكز الطبية</p>

      <div class="brand-features">
        <div class="feature-item" *ngFor="let f of features">
          <div class="feature-icon">
            <i [class]="f.icon"></i>
          </div>
          <div class="feature-text">
            <span class="feature-title">{{ f.title }}</span>
            <span class="feature-desc">{{ f.desc }}</span>
          </div>
        </div>
      </div>

      <!-- Decorative circles -->
      <div class="deco-circle deco-1"></div>
      <div class="deco-circle deco-2"></div>
      <div class="deco-circle deco-3"></div>

    </div>
  </div>

  <!-- RIGHT PANEL — Login Form -->
  <div class="form-panel">
    <div class="form-card animate-fade-in">

      <div class="form-header">
        <h1 class="form-title">مرحباً بك 👋</h1>
        <p class="form-subtitle">سجّل دخولك للمتابعة</p>
      </div>

      <!-- Server Error Alert -->
      <div class="error-alert" *ngIf="serverError">
        <i class="pi pi-exclamation-triangle"></i>
        <span>{{ serverError }}</span>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email Field -->
        <div class="form-group">
          <label for="login-email">البريد الإلكتروني</label>
          <div class="input-wrapper" [class.has-error]="emailControl.invalid && emailControl.touched">
            <i class="pi pi-envelope input-icon"></i>
            <input
              id="login-email"
              type="email"
              formControlName="email"
              placeholder="example@clinic.com"
              autocomplete="email"
              class="form-input"
              dir="ltr"
            />
          </div>
          <span class="field-error" *ngIf="emailControl.invalid && emailControl.touched">
            {{ emailError }}
          </span>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="login-password">كلمة المرور</label>
          <div class="input-wrapper" [class.has-error]="passwordControl.invalid && passwordControl.touched">
            <i class="pi pi-lock input-icon"></i>
            <input
              id="login-password"
              [type]="showPassword ? 'text' : 'password'"
              formControlName="password"
              placeholder="••••••••"
              autocomplete="current-password"
              class="form-input"
              dir="ltr"
            />
            <button type="button" class="toggle-password" (click)="togglePassword()" id="toggle-password-btn">
              <i class="pi" [class.pi-eye]="!showPassword" [class.pi-eye-slash]="showPassword"></i>
            </button>
          </div>
          <span class="field-error" *ngIf="passwordControl.invalid && passwordControl.touched">
            {{ passwordError }}
          </span>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-btn"
          id="login-submit-btn"
          [disabled]="isLoading"
        >
          <span class="spinner" *ngIf="isLoading"></span>
          <i class="pi pi-sign-in" *ngIf="!isLoading"></i>
          <span>{{ isLoading ? 'جاري تسجيل الدخول...' : 'تسجيل الدخول' }}</span>
        </button>

      </form>

      <div class="form-footer">
        <span class="footer-text">نظام ميديكا لإدارة العيادات © {{ currentYear }}</span>
      </div>

    </div>
  </div>

</div>
