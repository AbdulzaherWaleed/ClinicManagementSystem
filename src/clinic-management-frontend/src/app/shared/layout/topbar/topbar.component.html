<header class="topbar">

  <!-- Page Title -->
  <div class="topbar-start">
    <h1 class="page-heading">{{ pageTitle }}</h1>
    <span class="page-date">{{ getCurrentDate() }}</span>
  </div>

  <!-- Right Actions -->
  <div class="topbar-end">

    <!-- Dark Mode Toggle -->
    <button class="icon-btn" title="تغيير المظهر" (click)="toggleDarkMode()">
      <i [class]="isDarkMode() ? 'pi pi-sun' : 'pi pi-moon'"></i>
    </button>

    <!-- Notification Bell -->
    <button *ngIf="configService.doctorLicensesEnabled()" class="icon-btn" title="الإشعارات" id="topbar-notifications-btn" (click)="op.toggle($event)">
      <i class="pi pi-bell"></i>
      <span class="notif-dot" *ngIf="expiringLicenses().length > 0"></span>
    </button>
    <p-popover #op [style]="{'width': '350px'}">
      <ng-template pTemplate="content">
        <div class="p-3">
          <h4 class="text-lg font-bold mb-3">الإشعارات</h4>
          <div *ngIf="expiringLicenses().length === 0" class="text-gray-500 text-sm">
            لا توجد إشعارات حالياً.
          </div>
          <div *ngIf="expiringLicenses().length > 0" class="flex flex-col gap-3">
            <div *ngFor="let lic of expiringLicenses()" class="p-3 bg-red-50 border-r-4 border-red-500 rounded shadow-sm">
              <div class="flex justify-between items-start mb-1">
                <span class="font-bold text-gray-800">{{ lic.doctorName }}</span>
                <span class="text-xs text-red-600 font-bold">ينتهي في: {{ lic.expiryDate | date:'shortDate' }}</span>
              </div>
              <p class="text-sm text-gray-600 m-0">
                ترخيص رقم: <span dir="ltr">{{ lic.licenseNumber || 'بدون رقم' }}</span>
              </p>
            </div>
          </div>
        </div>
      </ng-template>
    </p-popover>

    <!-- Divider -->
    <div class="topbar-divider"></div>

    <!-- User Info -->
    <div class="user-section" *ngIf="currentUser()">
      <div class="user-meta">
        <span class="user-display-name">{{ currentUser()?.fullName }}</span>
        <span [class]="getRoleBadgeClass(currentUser()?.role ?? null)">
          {{ getRoleLabel(currentUser()?.role ?? null) }}
        </span>
      </div>
      <div class="user-topbar-avatar">
        <i class="pi pi-user"></i>
      </div>
    </div>

  </div>

</header>
