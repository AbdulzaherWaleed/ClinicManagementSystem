<aside class="sidebar" [class.collapsed]="isCollapsed()">

  <!-- Logo / Header -->
  <div class="sidebar-header">
    <div class="logo-area" *ngIf="!isCollapsed()">
      <div class="logo-icon">
        <i class="pi pi-heart-fill"></i>
      </div>
      <div class="logo-text">
        <span class="logo-title">ميديكا</span>
        <span class="logo-subtitle">نظام إدارة العيادات</span>
      </div>
    </div>
    <button class="collapse-btn" (click)="toggleCollapse()" [title]="isCollapsed() ? 'توسيع' : 'تصغير'">
      <i class="pi" [class.pi-angle-right]="isCollapsed()" [class.pi-angle-left]="!isCollapsed()"></i>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <div class="nav-group" *ngFor="let group of visibleGroups()">

      <div class="nav-group-label" *ngIf="!isCollapsed()">{{ group.label }}</div>

      <a
        *ngFor="let item of group.items"
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [title]="isCollapsed() ? item.label : ''"
      >
        <i class="nav-item-icon" [class]="item.icon"></i>
        <span class="nav-item-label" *ngIf="!isCollapsed()">{{ item.label }}</span>
        <span class="nav-badge" *ngIf="item.badge && !isCollapsed()">{{ item.badge }}</span>
      </a>

    </div>
  </nav>

  <!-- User Profile Section -->
  <div class="sidebar-footer" *ngIf="currentUser()">
    <div class="user-card" [class.compact]="isCollapsed()">
      <div class="user-avatar">
        <i class="pi pi-user"></i>
      </div>
      <div class="user-info" *ngIf="!isCollapsed()">
        <div class="user-name">{{ currentUser()?.fullName }}</div>
        <div class="user-role">{{ getRoleLabel(currentUser()?.role ?? null) }}</div>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" [title]="'تسجيل الخروج'">
      <i class="pi pi-sign-out"></i>
      <span *ngIf="!isCollapsed()">خروج</span>
    </button>
  </div>

</aside>
